<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title description">
  <title id="title">Blackbox terminal demo</title>
  <desc id="description">A synthetic Blackbox capture is created and analyzed, showing a critical block I/O latency report.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#010409" flood-opacity="0.55"/>
    </filter>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <style>
      .terminal { font-family: "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 17px; }
      .small { font-size: 15px; }
      .muted { fill: #8b949e; }
      .text { fill: #e6edf3; }
      .cyan { fill: #79c0ff; }
      .green { fill: #3fb950; }
      .yellow { fill: #d29922; }
      .red { fill: #f85149; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="810" rx="28" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <rect x="34" y="30" width="1132" height="748" rx="15" fill="#010409" stroke="#30363d"/>
    <path d="M49 30h1102a15 15 0 0 1 15 15v39H34V45a15 15 0 0 1 15-15z" fill="#161b22"/>
    <line x1="34" y1="84" x2="1166" y2="84" stroke="#30363d"/>
    <circle cx="64" cy="57" r="7" fill="#f85149"/>
    <circle cx="88" cy="57" r="7" fill="#d29922"/>
    <circle cx="112" cy="57" r="7" fill="#3fb950"/>
    <text x="600" y="63" text-anchor="middle" class="terminal small muted">blackbox demo</text>
  </g>

  <g class="terminal">
    <text x="62" y="121"><tspan class="green bold">$</tspan><tspan class="text"> ./blackbox demo -o demo.bbx</tspan></text>
    <text x="62" y="151" class="muted">/work/demo.bbx</text>
    <text x="62" y="188"><tspan class="green bold">$</tspan><tspan class="text"> ./blackbox analyze demo.bbx</tspan></text>

    <text x="62" y="229" class="cyan bold">╭─ BLACKBOX ───────────────────────────────────────────────────────────────────────────────╮</text>
    <text x="62" y="258"><tspan class="cyan bold">│</tspan><tspan class="red bold"> ✕ CRITICAL LATENCY OBSERVED</tspan><tspan class="cyan bold" x="1131">│</tspan></text>
    <text x="62" y="287"><tspan class="cyan bold">│</tspan><tspan class="text"> Signals: at least 3 critical latency observations among 3 slow observations.</tspan><tspan class="cyan bold" x="1131">│</tspan></text>
    <text x="62" y="316"><tspan class="cyan bold">│</tspan><tspan class="text"> Evidence: no collection gaps reported in captured aggregate intervals.</tspan><tspan class="cyan bold" x="1131">│</tspan></text>
    <text x="62" y="345"><tspan class="cyan bold">│</tspan><tspan class="text"> Largest retained latency: Block I/O 300ms · demo-database PID 1234.</tspan><tspan class="cyan bold" x="1131">│</tspan></text>
    <text x="62" y="374" class="cyan bold">╰──────────────────────────────────────────────────────────────────────────────────────────╯</text>

    <text x="78" y="407" class="muted">synthetic-demo · Linux synthetic (no eBPF) · portable · Blackbox 0.1.0</text>
    <text x="78" y="436" class="muted">2026-09-18 12:00:00.000 → 12:00:10.000 UTC · 10s</text>
    <text x="78" y="465"><tspan class="yellow bold">?</tspan><tspan class="text"> Synthetic demonstration</tspan><tspan class="muted"> · no host was recorded</tspan></text>

    <text x="78" y="510" class="text bold">SIGNALS</text>
    <line x1="174" y1="504" x2="1138" y2="504" stroke="#30363d"/>
    <text x="78" y="542"><tspan class="red bold">✕</tspan><tspan class="text bold"> Block I/O</tspan><tspan class="text"> · 3 slow requests / 1,003 measured (≥50ms)</tspan></text>
    <text x="104" y="571" class="muted">p50 &lt;1ms · p95 &lt;1ms · p99 &lt;1ms · worst retained 300ms · 3 critical (≥250ms)</text>
    <text x="78" y="602"><tspan class="green bold">✓</tspan><tspan class="text bold"> Scheduler</tspan><tspan class="text"> · No slow runnable waits / 1,000 measured (≥20ms)</tspan></text>
    <text x="78" y="633"><tspan class="green bold">✓</tspan><tspan class="text bold"> TCP</tspan><tspan class="text"> · No retransmissions or resets observed</tspan></text>
    <text x="78" y="664"><tspan class="green bold">✓</tspan><tspan class="text bold"> OOM</tspan><tspan class="text"> · No OOM victims observed</tspan></text>

    <text x="78" y="708" class="text bold">EVENTS · UTC</text>
    <line x1="210" y1="702" x2="1138" y2="702" stroke="#30363d"/>
    <text x="78" y="741" class="small"><tspan class="muted">12:00:04.100</tspan><tspan class="text">   demo-database   PID 1234   </tspan><tspan class="red bold">I/O 300ms</tspan><tspan class="muted">   read 8:0 · 4096 B</tspan></text>
  </g>
</svg>
