# Each kernel runs in its own disposable QEMU guest, never on a shared server.
name: Kernel integration
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      kernels: ${{ steps.select.outputs.kernels }}
    steps:
      - id: select
        env:
          FULL_MATRIX: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [ "$FULL_MATRIX" = true ]; then
            echo 'kernels=["5.10","5.15","6.1","6.6","6.12","stable"]' >> "$GITHUB_OUTPUT"
          else
            echo 'kernels=["5.10","6.1","6.12"]' >> "$GITHUB_OUTPUT"
          fi
  kernel_tests:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        kernel: ${{ fromJSON(needs.matrix.outputs.kernels) }}
    name: Linux ${{ matrix.kernel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      BLACKBOX_TEST_BLOCK_DEVICE: /dev/loop0
      KERNEL_IMAGE: ghcr.io/cilium/ci-kernels:${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install kernel test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 iproute2 util-linux
          go install lmb.io/vimto@v0.4.0
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Record kernel image digest
        run: docker buildx imagetools inspect "$KERNEL_IMAGE"
      - name: Run real-kernel integration
        run: vimto -kernel "$KERNEL_IMAGE" -- go test -tags integration -count=1 -timeout=10m -p=1 -v ./test/integration ./internal/sensor
  # Preserve the required check name used before the matrix was introduced.
  kernel:
    if: ${{ always() }}
    needs: [matrix, kernel_tests]
    runs-on: ubuntu-latest
    steps:
      - env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          TEST_RESULT: ${{ needs.kernel_tests.result }}
        run: test "$MATRIX_RESULT" = success && test "$TEST_RESULT" = success
