name: Bug report
description: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include sensitive captures or infrastructure details. Report vulnerabilities privately using SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands and relevant configuration with sensitive metadata removed.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and evidence
      description: Blackbox version, kernel, architecture, native/Docker deployment, sensor availability and relevant counters.
    validations:
      required: true
