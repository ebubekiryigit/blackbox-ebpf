# Generated by make docs; copy to config.yml before customizing.
# Compiled defaults → this file → explicitly provided CLI flags.
# Every setting is optional. Restart the daemon after changes.

# Daemon log verbosity: debug, info, warn, error. Logs go to stderr.
log_level: info
# Rolling history to keep: 1s–24h. Examples: 30s, 5m, 1h.
history: 5m
# Retained history budget: 1MiB–1GiB (B, KiB, MiB, GiB).
# Total process memory also includes queues, Go runtime and snapshot work; kernel maps are separate.
max_memory: 32MiB
# Enabled sensors: block_io, scheduler, tcp, oom. Choose one or more; no duplicates.
sensors:
  - block_io
  - scheduler
  - tcp
  - oom
# false: continue with available sensors and report missing coverage.
# true: fail startup or stop recording if any enabled sensor fails permanently.
strict: false
# How often to collect sensor totals: 100ms–1m, no longer than history.
# Shorter intervals improve time resolution and increase polling work.
poll_interval: 1s
# Maximum local control request/snapshot duration: 1s–10m. Examples: 30s, 1m.
timeout: 30s
# Latency thresholds. Durations must be positive; critical must exceed warn.
# Warn selects slow-event details; critical raises report severity. Neither establishes a root cause.
thresholds:
  # Device I/O request latency (not application request duration).
  block_io:
    # Slow I/O threshold. Example: 50ms.
    warn: 50ms
    # Critical I/O threshold. Example: 250ms.
    critical: 250ms
  # Runnable-to-running wait (not CPU execution time).
  scheduler:
    # Slow runnable wait threshold. Example: 20ms.
    warn: 20ms
    # Critical runnable wait threshold. Example: 100ms.
    critical: 100ms
