services:
  blackbox:
    build: .
    image: blackbox
    privileged: true
    pid: host
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 35s
    working_dir: /captures
    command: ["daemon", "--config", "/etc/blackbox/config.yml"]
    volumes:
      # BTF enables CO-RE; these sensors do not need bpffs or debugfs mounts.
      - /sys/kernel/btf:/sys/kernel/btf:ro
      - ./config.yml:/etc/blackbox/config.yml:ro
      - ./captures:/captures
    # The socket stays inside this container; use docker compose exec for clients.
    healthcheck:
      test: ["CMD", "/app/blackbox", "status"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
